<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK2D3DLive</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        /* ထိပ်ဆုံး Live ကတ်ပြား */
        .live-card {
            background-color: #161b28;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #1f2638;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header-icons {
            display: flex;
            gap: 12px;
            font-size: 14px;
        }
        .live-number {
            font-size: 55px;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .update-status {
            font-size: 12px;
            color: #2ecc71;
        }

        /* 12:01 PM / 4:30 PM ဇယားကွက်များ (Set, Value ပါဝင်သော ပုံစံ) */
        .time-card {
            background-color: #161b28;
            border: 1px solid #283559;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
        }
        .time-title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
            text-align: center;
        }
        .row-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .data-group div:first-child {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .data-group div:last-child {
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
        }
        .twod-val {
            font-size: 22px;
            font-weight: bold;
            color: #fbbf24;
        }

        /* 9:30 AM / 2:00 PM Modern / Internet ဇယားကွက်များ */
        .modern-card {
            background-color: #161b28;
            border: 1px solid #283559;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mod-time {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }
        .mod-values {
            display: flex;
            gap: 25px;
            text-align: center;
        }
        .mod-box div:first-child {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .mod-box div:last-child {
            font-size: 18px;
            font-weight: bold;
            color: #00e676;
        }

        /* အောက်ဆုံး API ခလုတ် */
        .api-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }
        .footer-text {
            text-align: center;
            font-size: 10px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-card">
            <div class="app-header">
                <span>MK2D3DLive</span>
                <div class="header-icons">
                    <span>ℹ️</span>
                    <span>3D</span>
                    <span>📅</span>
                    <span>🕒</span>
                </div>
            </div>
            <div class="live-number" id="live-twod">--</div>
            <div class="update-status" id="live-time">✓ Updated: --</div>
        </div>

        <div id="results-container">
            <div class="modern-card">
                <div class="mod-time">09:30 AM</div>
                <div class="mod-values">
                    <div class="mod-box">
                        <div>Modern</div>
                        <div id="m-930">--</div>
                    </div>
                    <div class="mod-box">
                        <div>Internet</div>
                        <div id="i-930">--</div>
                    </div>
                </div>
            </div>

            <div class="time-card">
                <div class="time-title">12:01 PM</div>
                <div class="row-details">
                    <div class="data-group">
                        <div>Set</div>
                        <div id="set-1201">--</div>
                    </div>
                    <div class="data-group">
                        <div>Value</div>
                        <div id="val-1201">--</div>
                    </div>
                    <div class="twod-val" id="2d-1201">--</div>
                </div>
            </div>

            <div class="modern-card">
                <div class="mod-time">02:00 PM</div>
                <div class="mod-values">
                    <div class="mod-box">
                        <div>Modern</div>
                        <div id="m-1400">--</div>
                    </div>
                    <div class="mod-box">
                        <div>Internet</div>
                        <div id="i-1400">--</div>
                    </div>
                </div>
            </div>

            <div class="time-card">
                <div class="time-title">04:30 PM</div>
                <div class="row-details">
                    <div class="data-group">
                        <div>Set</div>
                        <div id="set-1630">--</div>
                    </div>
                    <div class="data-group">
                        <div>Value</div>
                        <div id="val-1630">--</div>
                    </div>
                    <div class="twod-val" id="2d-1630">--</div>
                </div>
            </div>
        </div>
        
<a href="history.html">ယခင်ရက်များသမိုင်းကြည့်ရန်</a>
        
        <button class="api-btn" onclick="window.location.href='/api-docs'">
            🔌 API for Developers
        </button>
        <div class="footer-text">This data is referenced from official sources</div>
    </div>

    <script>
        // API မှ ဒေတာများကို ဆွဲယူခြင်း
        fetch('/2d_result')
            .then(response => response.json())
            .then(data => {
                // ၁။ Live ဂဏန်းနှင့် အချိန်
                if (data.live) {
                    document.getElementById('live-twod').innerText = data.live.twod || '--';
                    document.getElementById('live-time').innerText = `✓ Updated: ${data.live.time || '--'}`;
                }

                // ၂။ အချိန်ဇယားများအလိုက် API ဒေတာများကို ဖြည့်သွင်းခြင်း
                let results = Array.isArray(data) ? data : (data.result || data.child || []);
                
                results.forEach(item => {
                    let time = (item.open_time || item.time || '').toLowerCase();
                    
                    if (time.includes('9:30')) {
                        document.getElementById('m-930').innerText = item.modern || item.set || '--';
                        document.getElementById('i-930').innerText = item.internet || item.value || '--';
                    } else if (time.includes('12:01')) {
                        document.getElementById('set-1201').innerText = item.set || '--';
                        document.getElementById('val-1201').innerText = item.value || '--';
                        document.getElementById('2d-1201').innerText = item.twod || '--';
                    } else if (time.includes('2:00') || time.includes('02:00')) {
                        document.getElementById('m-1400').innerText = item.modern || item.set || '--';
                        document.getElementById('i-1400').innerText = item.internet || item.value || '--';
                    } else if (time.includes('4:30') || time.includes('04:30')) {
                        document.getElementById('set-1630').innerText = item.set || '--';
                        document.getElementById('val-1630').innerText = item.value || '--';
                        document.getElementById('2d-1630').innerText = item.twod || '--';
                    }
                });
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
    </script>

</body>
</html>
