<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiStock 2D</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        /* ထိပ်ဆုံး Live ကတ်ပြား */
        .live-card {
            background-color: #161b28;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #1f2638;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header-icons {
            display: flex;
            gap: 12px;
            font-size: 14px;
        }
        .live-number {
            font-size: 55px;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .update-status {
            font-size: 12px;
            color: #2ecc71;
        }

        /* အချိန်အလိုက် ရလဒ်ဇယားကွက်များ (ဗီဒီယိုပါ ပုံစံအတိုင်း) */
        .time-card {
            background-color: #161b28;
            border: 1px solid #283559;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
        }
        .time-title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .row-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .data-group div:first-child {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .data-group div:last-child {
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
        }
        .twod-val {
            font-size: 22px;
            font-weight: bold;
            color: #fbbf24;
        }

        /* 9:30 AM / 2:00 PM ကဲ့သို့ Modern/Internet ပုံစံအတွက် */
        .modern-card {
            background-color: #161b28;
            border: 1px solid #283559;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mod-time {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }
        .mod-values {
            display: flex;
            gap: 20px;
            text-align: center;
        }
        .mod-box div:first-child {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .mod-box div:last-child {
            font-size: 18px;
            font-weight: bold;
            color: #00e676;
        }

        /* အောက်ဆုံး API ခလုတ် */
        .api-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }
        .footer-text {
            text-align: center;
            font-size: 10px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-card">
            <div class="app-header">
                <span>ThaiStock 2D</span>
                <div class="header-icons">
                    <span>ℹ️</span>
                    <span>3D</span>
                    <span>📅</span>
                    <span>🕒</span>
                </div>
            </div>
            <div class="live-number" id="live-twod">--</div>
            <div class="update-status" id="live-time">✓ Updated: --</div>
        </div>

        <div id="results-container">
            <div style="text-align: center; color: #94a3b8; padding: 20px;">ဒေတာများကို ဆွဲယူနေပါပြီ...</div>
        </div>

        <button class="api-btn" onclick="window.location.href='/api-docs'">
            🔌 API for Developers
        </button>
        <div class="footer-text">This data is referenced from ThaiStock official website</div>
    </div>

    <script>
        // သင့်ရဲ့ API (`/2d_result`) မှ ဒေတာများကို ယူဆောင်လာခြင်း
        fetch('/2d_result')
            .then(response => response.json())
            .then(data => {
                // ၁။ Live ဂဏန်းနှင့် အချိန်ကို ထည့်သွင်းခြင်း
                if (data.live) {
                    document.getElementById('live-twod').innerText = data.live.twod || '--';
                    document.getElementById('live-time').innerText = `✓ Updated: ${data.live.time || '--'}`;
                }

                // ၂။ API ထဲပါသည့် အချိန်ဇယားများအလိုက် Card များကို အလိုအလျောက် ဖန်တီးခြင်း
                const container = document.getElementById('results-container');
                container.innerHTML = '';
                
                let results = Array.isArray(data) ? data : (data.result || []);

                results.forEach(item => {
                    const card = document.createElement('div');
                    
                    // API ထဲပါသော open_time (ဥပမာ- 12:01 PM, 04:30 PM စသည်) အတိုင်း အလိုအလျောက် ပေါ်မည်
                    card.className = 'time-card';
                    card.innerHTML = `
                        <div class="time-title">${item.open_time || ''}</div>
                        <div class="row-details">
                            <div class="data-group">
                                <div>Set</div>
                                <div>${item.set || '--'}</div>
                            </div>
                            <div class="data-group">
                                <div>Value</div>
                                <div>${item.value || '--'}</div>
                            </div>
                            <div class="twod-val">${item.twod || '--'}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('results-container').innerHTML = '<div style="text-align: center; color: #ef4444;">ဒေတာ ဆွဲယူ၍မရပါ။</div>';
            });
    </script>

</body>
</html>
