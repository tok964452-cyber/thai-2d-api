<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK2D3DLive</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 450px; margin: 0 auto; }
        .live-card { background-color: #161b28; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; border: 1px solid #1f2638; }
        .live-number { font-size: 55px; font-weight: bold; color: #ffffff; margin: 10px 0; letter-spacing: 2px; }
        .update-status { font-size: 12px; color: #2ecc71; }
        .time-card { background-color: #161b28; border: 1px solid #283559; border-radius: 14px; padding: 14px 18px; margin-bottom: 12px; }
        .time-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; text-align: center; }
        .row-details { display: flex; justify-content: space-between; align-items: center; }
        .data-group div:first-child { font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
        .data-group div:last-child { font-size: 13px; font-weight: 500; color: #e2e8f0; }
        .twod-val { font-size: 22px; font-weight: bold; color: #fbbf24; }
        .nav-links { display: flex; justify-content: space-around; margin-top: 20px; }
        .nav-links a { color: #38bdf8; text-decoration: none; font-size: 14px; background: #161b28; padding: 8px 15px; border-radius: 8px; border: 1px solid #283559; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Live Card -->
        <div class="live-card">
            <div style="font-weight:bold;">MK2D3DLive</div>
            <div class="live-number" id="live-2d">--</div>
            <div class="update-status" id="live-time">Updated: --</div>
        </div>

        <!-- 09:30 AM (Modern, Internet) -->
        <div class="time-card">
            <div class="time-title">09:30 AM</div>
            <div class="row-details">
                <div class="data-group"><div>Modern</div><div id="m-930">--</div></div>
                <div class="data-group"><div>Internet</div><div id="i-930">--</div></div>
            </div>
        </div>

        <!-- 12:01 PM (Set, Value, 2D) -->
        <div class="time-card">
            <div class="time-title">12:01 PM</div>
            <div class="row-details">
                <div class="data-group"><div>Set</div><div id="set-1201">--</div></div>
                <div class="data-group"><div>Value</div><div id="val-1201">--</div></div>
                <div class="twod-val" id="2d-1201">--</div>
            </div>
        </div>

        <!-- 02:00 PM (Modern, Internet) -->
        <div class="time-card">
            <div class="time-title">02:00 PM</div>
            <div class="row-details">
                <div class="data-group"><div>Modern</div><div id="m-1400">--</div></div>
                <div class="data-group"><div>Internet</div><div id="i-1400">--</div></div>
            </div>
        </div>

        <!-- 04:30 PM (Set, Value, 2D) -->
        <div class="time-card">
            <div class="time-title">04:30 PM</div>
            <div class="row-details">
                <div class="data-group"><div>Set</div><div id="set-1630">--</div></div>
                <div class="data-group"><div>Value</div><div id="val-1630">--</div></div>
                <div class="twod-val" id="2d-1630">--</div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-links">
            <a href="history.html">ရလဒ်ဟောင်းများ</a>
            <a href="3d.html">3D ရလဒ်များ</a>
        </div>
    </div>

    <script>
        function fetchHistoryByDate(selectedDate) {
    if (!selectedDate) return;
    clearHistoryData();

    fetch(`/2d_result?date=${selectedDate}`)
        .then(response => response.json())
        .then(data => {
            let results = data.child || [];
            
            // 09:30 AM
            document.getElementById('m-930').innerText = results[0].modern || '--';
            document.getElementById('i-930').innerText = results[0].internet || '--';
            
            // 12:01 PM
            document.getElementById('set-1201').innerText = results[1].set || '--';
            document.getElementById('val-1201').innerText = results[1].value || '--';
            document.getElementById('2d-1201').innerText = results[1].twod || '--';
            
            // 02:00 PM
            document.getElementById('m-1400').innerText = results[2].modern || '--';
            document.getElementById('i-1400').innerText = results[2].internet || '--';
            
            // 04:30 PM
            document.getElementById('set-1630').innerText = results[3].set || '--';
            document.getElementById('val-1630').innerText = results[3].value || '--';
            document.getElementById('2d-1630').innerText = results[3].twod || '--';
        });
}

    </script>
</body>
</html>
